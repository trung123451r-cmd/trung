name: Build KernelSU-Next

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev build-essential bc bison flex libelf-dev

      - name: Install KernelSU-Next
        run: |
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/main/kernel/setup.sh" | bash -

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu/
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi/
          
          # Cấu hình theo tên máy của bạn (ví dụ: begonia_user_defconfig)
          make O=out begonia_user_defconfig
          make O=out -j$(nproc)

      - name: Upload Output
        uses: actions/upload-artifact@v4
        with:
          name: boot-image
          path: out/arch/arm64/boot/Image.gz-dtb
